name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 6.5.0)'
        required: true
        type: string
      tested_up_to:
        description: 'WP "Tested up to" version (blank = keep current)'
        required: false
        type: string
      phase:
        description: 'Release phase'
        required: true
        type: choice
        options:
          - prepare
          - publish

  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: release-business-directory-plugin
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Create release branch
        run: git checkout -b release/${{ inputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect changelog context
        id: changelog-context
        run: |
          set -euo pipefail
          CONTEXT="${GITHUB_WORKSPACE}/.changelog-context.txt"
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "Release version: ${{ inputs.version }}"
            echo
            if [ -n "$LAST_TAG" ]; then
              echo "Last tag: ${LAST_TAG}"
              echo
              echo "== Commits since ${LAST_TAG} =="
              git log --no-merges --pretty=format:'%s' "${LAST_TAG}..HEAD"
              echo
              echo
              echo "== Changed files =="
              git diff --stat "${LAST_TAG}..HEAD"
              echo
              echo "== Name status =="
              git diff --name-status "${LAST_TAG}..HEAD"
            else
              echo "No tags found."
              echo
              echo "== Last 50 commits =="
              git log --no-merges --pretty=format:'%s' -50
              echo
            fi
          } > "$CONTEXT"
          echo "path=${CONTEXT}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog via Claude Code
        id: generate-changelog
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are generating a changelog entry for a WordPress plugin release.
            Version: ${{ inputs.version }}

            Use ONLY these sources:
            1. ${{ steps.changelog-context.outputs.path }} (commits and changed-file summary)
            2. The existing changelog in README.TXT (first 3-4 entries after `== Changelog ==`)

            Do NOT run a full `git diff` of file contents. The context file is enough.
            If you need more detail, Read at most a few individual source files named in the context.
            Do not read binaries, lockfiles, vendor, dist, or generated assets.

            Write a changelog entry and insert it into README.TXT right after the `== Changelog ==` line.
            Remove the oldest changelog entry from the bottom of the changelog section (the last `= x.x.x =` block and its bullet lines). Preserve any trailing links or text after the changelog entries.

            Changelog format rules:
            - First line: = ${{ inputs.version }} =
            - Each subsequent line: * New: , * Enhancement: , or * Fix: followed by a concise user-facing description
            - Group related changes into single entries
            - Skip merge commits, CI/tooling changes, dependency updates, and non-user-facing changes
            - Omit any security-related fixes entirely (auth bypasses, XSS, CSRF, privilege escalation, sanitization/escaping hardening for vulnerabilities, CVEs, etc.). Do not describe them and do not add vague placeholders like "* Fix: Security improvements" or "* Fix: Security Vulnerabilities". If a change mixes security and non-security work, include only the non-security user-facing parts.
            - Match the exact formatting style of the existing entries in README.TXT
            - End the entry with an empty line before the next entry

            Finish in as few turns as possible. Only modify README.TXT.
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 10
            --allowedTools "Read,Edit,Write"

      - name: Ensure changelog entry exists
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          rm -f .changelog-context.txt
          if grep -qE "^= ${VERSION} =" README.TXT; then
            echo "Changelog entry for ${VERSION} already present."
            exit 0
          fi
          echo "Claude did not add a changelog entry. Inserting a fallback."
          python3 - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          path = Path("README.TXT")
          text = path.read_text()
          marker = "== Changelog ==\n"
          if marker not in text:
              raise SystemExit("README.TXT is missing == Changelog ==")

          entry = f"= {version} =\n* Enhancement: Various improvements and fixes.\n\n"
          text = text.replace(marker, f"{marker}{entry}", 1)

          entries = list(re.finditer(r"^= [^=\n]+ =\n", text, re.MULTILINE))
          if len(entries) < 2:
              raise SystemExit("README.TXT does not contain an older changelog entry to remove")

          oldest = entries[-1]
          trailing = text[oldest.end():].splitlines(keepends=True)
          entry_end = oldest.end()
          for line in trailing:
              if line.startswith("* ") or not line.strip():
                  entry_end += len(line)
                  continue
              break
          text = text[:oldest.start()] + text[entry_end:]
          path.write_text(text)
          PY

      - name: Bump version and update assets
        run: |
          pnpm run build
          pnpm exec grunt setversion:plugin:${{ inputs.version }}
          pnpm exec grunt less:plugin

      - name: Update Tested up to
        if: inputs.tested_up_to != ''
        run: |
          sed -i "s/^Tested up to: .*/Tested up to: ${{ inputs.tested_up_to }}/" README.TXT

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare release ${{ inputs.version }}"
          git push -u origin release/${{ inputs.version }}

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh pr create \
            --title "Release ${{ inputs.version }}" \
            --body "$(cat <<'EOF'
          ## Release ${{ inputs.version }}

          Automated release preparation:
          - Version bumped in plugin file, class-wpbdp.php, theme.json, and README.TXT
          - Assets rebuilt (webpack, LESS, uglify)
          - Changelog generated
          - Translation .pot file regenerated

          **Next steps:**
          1. Review the changes
          2. Merge this PR to create the release
          EOF
          )" \
            --base master

  publish-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GH_TOKEN }}

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}
          gh release create v${{ inputs.version }} \
            --title "v${{ inputs.version }}" \
            --generate-notes

  extract-version:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Extract version from branch name
        id: parse
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "version=${BRANCH#release/}" >> "$GITHUB_OUTPUT"

  publish-on-merge:
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GH_TOKEN }}

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git tag v${{ needs.extract-version.outputs.version }}
          git push origin v${{ needs.extract-version.outputs.version }}
          gh release create v${{ needs.extract-version.outputs.version }} \
            --title "v${{ needs.extract-version.outputs.version }}" \
            --generate-notes
